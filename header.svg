<svg fill="none" viewBox="0 0 800 240" width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          background: linear-gradient(135deg, #0a0a0a, #111827, #0f172a, #050505);
          background-size: 300% 300%;
          animation: gradientShift 14s ease infinite;
          border-radius: 18px;
          height: 240px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          color: white;
          text-align: center;
        }

        @keyframes gradientShift {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        .title {
          font-size: 42px; /* Increased from 32px */
          font-weight: bold;
          letter-spacing: 5px;
          margin-bottom: 12px;
        }

        .typewriter {
          font-family: monospace; /* Monospace is required for the "ch" timing to work perfectly */
          font-size: 24px; /* Increased from 18px */
          color: #9ca3af;
          overflow: hidden;
          white-space: nowrap;
          border-right: 3px solid #00eaff;
          width: 0;
          /* The text is 36 characters long including spaces/dots */
          animation: 
            type 3.5s steps(36) 1s forwards, 
            cursorBlink .7s infinite;
        }

        @keyframes type {
          from { width: 0; }
          to { width: 41ch; } /* Uses character count for scaling */
        }

        @keyframes cursorBlink {
          50% { border-color: transparent; }
        }
      </style>

      <div class="container">
        <div class="title">🌑 J O S H I N — X 1 7</div>
        <div class="typewriter">Engineer • Builder • Thinker • Optimizer</div>
      </div>
    </div>
  </foreignObject>
</svg>
